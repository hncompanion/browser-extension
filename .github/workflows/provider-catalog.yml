name: Provider catalog

# Checks the curated OpenAI-compatible presets against models.dev. This depends
# on a live third-party API and on providers retiring models, so it runs on a
# schedule and when the catalog changes instead of gating releases.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/openai-compatible-providers.js'
      - 'src/lib/host-permissions.js'
      - 'scripts/providers.js'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate provider catalog against models.dev
        run: pnpm providers:check
